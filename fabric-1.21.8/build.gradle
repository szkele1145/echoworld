plugins {
    id 'java-library'
    id 'fabric-loom' version '1.12.1'
}

version = '0.3.7'
group = 'dev.worldreplay'
base { archivesName = 'worldreplay' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.8'
    mappings 'net.fabricmc:yarn:1.21.8+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.136.1+1.21.8'
    implementation project(':core')
    // Mixin：Fabric API 没有"方块放置"事件，只能钩 BlockItem.place 补齐
    modImplementation 'net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5'
}

loom {
    mixin {
        defaultRefmapName = 'worldreplay.refmap.json'
    }
}

tasks.register('copyCoreClasses', Copy) {
    from(project(':core').sourceSets.main.output)
    into(layout.buildDirectory.dir('classes/java/main'))
}
tasks.named('compileJava') { dependsOn tasks.named('copyCoreClasses') }
tasks.named('jar') {
    dependsOn tasks.named('copyCoreClasses')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('remapJar') {
    archiveFileName = "worldreplay-${version}-1.21.8-fabric.jar"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}