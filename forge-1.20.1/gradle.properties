# ForgeGradle 需要代理才能下载 MC / Forge 产物。
# 只有走代理的域名才用 proxyHost；直连可达的域名必须放进 nonProxyHosts，
# 否则会被代理拦下（libraries.minecraft.net 走代理是 000，直接连是 200）。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=65532
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=65532
systemProp.http.nonProxyHosts=localhost|127.0.0.1|libraries.minecraft.net|piston-data.mojang.com|piston-meta.mojang.com|maven.minecraftforge.net|repo.maven.apache.org|repo1.maven.org|maven.aliyun.com
systemProp.https.nonProxyHosts=localhost|127.0.0.1|libraries.minecraft.net|piston-data.mojang.com|piston-meta.mojang.com|maven.minecraftforge.net|repo.maven.apache.org|repo1.maven.org|maven.aliyun.com
org.gradle.jvmargs=-Xmx2G -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=65532 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=65532 -Dhttp.nonProxyHosts=localhost|127.0.0.1|libraries.minecraft.net|piston-data.mojang.com|piston-meta.mojang.com|maven.minecraftforge.net|repo.maven.apache.org|repo1.maven.org|maven.aliyun.com
org.gradle.workers.max=1
