plugins {
    id 'java-library'
}

group = 'dev.worldreplay'
version = '0.1.0'

base {
    archivesName = 'echoworld-core'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// 共享 core 同时供给 NeoForge 1.21.1（Java 21）与 Fabric 1.19.4/1.20.1（Java 17）。
// 用 JDK 21 编译但产出 17 字节码，两边都能加载。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

javadoc {
    options.encoding = 'UTF-8'
}

// 零依赖自检（无 JUnit：mavenCentral 不可达）—— build 时顺带跑，失败即构建失败
tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the zero-dependency core regression self-test.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.worldreplay.core.event.CoreSelfTest'
}
tasks.named('check') {
    dependsOn tasks.named('selfTest')
}
