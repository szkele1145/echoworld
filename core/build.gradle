plugins {
    id 'java-library'
}

group = 'dev.worldreplay'
version = '0.1.0'

base {
    archivesName = 'echoworld-core'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

javadoc {
    options.encoding = 'UTF-8'
}
