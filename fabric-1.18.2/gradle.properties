org.gradle.java.home=D:/tools/jdk21

# 本地代理（maven.fabricmc.net / piston-data.mojang.com 直连不通，代理仍有效）。
#
# loom 的下载器用 JDK 自带 HttpClient，不读 systemProp.http.proxyHost，
# 只认 JVM 的代理属性（-Dhttps.proxyHost=...）——所以代理必须写进 jvmargs。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=65532
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=65532
systemProp.http.nonProxyHosts=localhost|127.0.0.1|libraries.minecraft.net|launchermeta.mojang.com|piston-data.mojang.com|piston-meta.mojang.com|maven.minecraftforge.net|repo.maven.apache.org|repo1.maven.org|maven.aliyun.com
org.gradle.jvmargs=-Xmx2G

systemProp.https.nonProxyHosts=localhost|127.0.0.1|libraries.minecraft.net|launchermeta.mojang.com|piston-data.mojang.com|piston-meta.mojang.com|maven.minecraftforge.net|repo.maven.apache.org|repo1.maven.org|maven.aliyun.com