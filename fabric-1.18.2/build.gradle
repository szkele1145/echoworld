plugins {
    id 'java-library'
    id 'fabric-loom' version '1.12.1'
}

version = '0.3.7'
group = 'dev.worldreplay'
base { archivesName = 'worldreplay' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

dependencies {
    minecraft 'com.mojang:minecraft:1.18.2'
    mappings 'net.fabricmc:yarn:1.18.2+build.4:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.14.24'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.18.2'
    implementation project(':core')
    // Mixin：Fabric API 没有"方块放置"事件，只能钩 BlockItem.postPlacement 补齐
    // （否则 Fabric 版回放里只有"使用"标记、没有"放置"标记）
    modImplementation 'net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5'
}

// Mixin 配置：refmap 名称（Fabric 侧不需要它，但 loom 要求显式声明）
loom {
    mixin {
        defaultRefmapName = 'worldreplay.refmap.json'
    }
}

// dev run 与 jar 共用：把 core 编译输出复制进本模块 classes（进 mod 边界，dev run 能加载）
tasks.register('copyCoreClasses', Copy) {
    from(project(':core').sourceSets.main.output)
    into(layout.buildDirectory.dir('classes/java/main'))
}
tasks.named('compileJava') { dependsOn tasks.named('copyCoreClasses') }
tasks.named('jar') {
    dependsOn tasks.named('copyCoreClasses')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Loom 交付的主产物是 remapJar，产物名在这里定
tasks.named('remapJar') {
    archiveFileName = "worldreplay-${version}-1.18.2-fabric.jar"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}