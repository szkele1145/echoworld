plugins {
    id 'java-library'
    id 'fabric-loom' version '1.9.2'
}

version = '0.2.1'
group = 'dev.worldreplay'
base { archivesName = 'worldreplay' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.2:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.14.24'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.90.0+1.20.1'
    implementation project(':core')
}

// dev run 与 jar 共用：把 core 编译输出复制进本模块 classes（进 mod 边界，dev run 能加载）
tasks.register('copyCoreClasses', Copy) {
    from(project(':core').sourceSets.main.output)
    into(layout.buildDirectory.dir('classes/java/main'))
}
tasks.named('compileJava') { dependsOn tasks.named('copyCoreClasses') }
tasks.named('jar') {
    dependsOn tasks.named('copyCoreClasses')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Loom 交付的主产物是 remapJar，产物名在这里定
tasks.named('remapJar') {
    archiveFileName = "worldreplay-${version}-1.20.1-fabric.jar"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
