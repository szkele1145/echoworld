org.gradle.java.home=D:/tools/jdk21

# 本地代理（maven.fabricmc.net / piston-data.mojang.com 直连不通，代理仍有效）。
#
# loom 的下载器用 JDK 自带 HttpClient，不读 systemProp.http.proxyHost，
# 只认 JVM 的代理属性（-Dhttps.proxyHost=...）——所以代理必须写进 jvmargs。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=65532
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=65532
systemProp.http.nonProxyHosts=localhost|127.0.0.1|libraries.minecraft.net|piston-data.mojang.com|piston-meta.mojang.com|maven.fabricmc.net|maven.minecraftforge.net|resources.download.minecraft.net|maven.aliyun.com|repo.maven.apache.org|repo1.maven.org
org.gradle.jvmargs=-Xmx2G -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=65532 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=65532 -Dhttp.nonProxyHosts=localhost|127.0.0.1|libraries.minecraft.net|piston-data.mojang.com|piston-meta.mojang.com|maven.fabricmc.net|maven.minecraftforge.net|resources.download.minecraft.net|maven.aliyun.com|repo.maven.apache.org|repo1.maven.org

systemProp.https.nonProxyHosts=localhost|127.0.0.1|libraries.minecraft.net|piston-data.mojang.com|piston-meta.mojang.com|maven.fabricmc.net|maven.minecraftforge.net|resources.download.minecraft.net|maven.aliyun.com|repo.maven.apache.org|repo1.maven.org