plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '0.3.1'
group = 'dev.worldreplay'
base { archivesName = 'worldreplay' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        worldreplay { sourceSet sourceSets.main }
    }
}

dependencies {
    // shadow 进 jar：core 类必须打进 mod jar（运行时 classpath 不含 Gradle 项目依赖）
    implementation project(':core')
}

// dev run 与 jar 共用：把 core 编译输出复制进本模块 classes（进 mod 边界，dev run 能加载）
tasks.register('copyCoreClasses', Copy) {
    from(project(':core').sourceSets.main.output)
    into(layout.buildDirectory.dir('classes/java/main'))
}
tasks.named('compileJava') { dependsOn tasks.named('copyCoreClasses') }
tasks.named('jar') {
    dependsOn tasks.named('copyCoreClasses')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // 最终产物名：worldreplay-0.1.0-1.21.1-neoforge.jar
    archiveFileName = "worldreplay-${version}-1.21.1-neoforge.jar"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    var replaceProperties = [
            minecraft_version      : '1.21.1',
            minecraft_version_range: '[1.21.1,1.22)',
            neo_version            : project.neo_version,
            neo_version_range      : '[21.1.0,)',
            mod_id                 : 'worldreplay',
            mod_name               : 'WorldReplay',
            mod_license            : 'All Rights Reserved',
            mod_version            : project.version,
            mod_authors            : 'WorldReplay',
            mod_description        : 'Full behavior recording and replay for Minecraft worlds: block changes, entity movement, and container operations.'
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}
